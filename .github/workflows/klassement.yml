name: Klassement Jong Cercle bijwerken

on:
  schedule:
    - cron: "17 3 * * *"   # elke nacht rond 04:17/05:17 Belgische tijd
  workflow_dispatch:        # knop "Run workflow" om manueel te starten

permissions:
  contents: write

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Klassement ophalen en pagina maken
        run: python3 generate.py
      - name: Opslaan
        run: |
          git config user.name "klassement-bot"
          git config user.email "klassement-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Klassement bijgewerkt $(date +%d/%m/%Y)"
          git push
